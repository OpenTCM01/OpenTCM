name: Public release checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Check tracked files for private content
        run: python scripts/check_public_files.py
      - name: Test public application configuration and routes
        run: python -m unittest discover -s tests -v
