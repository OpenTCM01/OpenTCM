  privacy:`<h2>OpenTCM 隐私政策</h2><div class="updated">最后更新日期：2026年5月13日</div><p>欢迎使用 OpenTCM。OpenTCM 目前是一个处于研究及测试阶段的中医人工智能问答平台，现阶段主要供受邀专家参与测试、评估及研究用途。</p><p>本政策说明我们在你使用本网站及相关测试服务时，可能如何收集、使用、处理、储存及保护资料。</p><div class="notice">本网站目前并非正式医疗服务平台，亦不向公众提供医疗诊断、治疗、处方、急症处理或个性化医疗建议。本网站内容只作一般中医知识、研究、测试及系统评估参考。</div><p>如你不同意本政策，请停止使用本网站。</p><h3>1. 平台性质</h3><p>OpenTCM 目前仍处于研究及测试阶段，网站功能、内容、AI 回答、系统稳定性及资料处理方式仍在测试及改进中。</p><p>本平台现阶段主要供受邀专家使用，目的包括：</p><ul><li>测试中医人工智能问答功能</li><li>评估系统回答质量、准确性及安全性</li><li>改善中医知识问答体验</li><li>进行非商业性研究及技术改进</li><li>排查错误及提升系统稳定性</li></ul><p>本平台并不提供医疗诊断、治疗、处方、急症处理或个性化医疗服务。</p><h3>2. 请勿输入敏感个人资料</h3><p>在使用 OpenTCM 时，请勿输入以下资料：</p><ul><li>身份证号码、护照号码或其他身份识别文件号码</li><li>完整姓名、完整住址或电话号码</li><li>银行、信用卡或付款资料</li><li>医疗记录编号</li><li>可直接识别你、病人或任何第三者身份的资料</li><li>你不希望被系统处理或记录的私人资料</li></ul><p>如测试内容涉及个案、症状、病史、体质、用药或健康资料，请先作匿名化或去识别化处理，避免输入可识别个人身份的内容。</p><h3>3. 我们可能收集哪些资料？</h3><p>在你使用本网站期间，我们可能会收集或处理你输入的内容、专家反馈、系统及技术资料、AI 问答资料及系统运作或错误排查所需纪录。</p><h3>4. 我们如何使用资料？</h3><p>我们可能将资料用于提供中医 AI 问答测试功能、测试及改善系统表现、评估回答质量及安全性、分析专家反馈、进行研究分析及技术改进、防止滥用，以及遵守适用法律或监管要求。</p><p>如资料被用于研究分析，我们会在合理可行范围内尽量采用匿名化、去识别化或汇总方式处理，以降低识别个别人士的风险。</p><h3>5. 研究及专家测试用途</h3><p>OpenTCM 目前主要作研究及专家测试用途。你在使用本网站时输入的内容及提供的反馈，可能会被用于分析及改进系统。</p><h3>6. 关于健康资料的重要提示</h3><p>你在本网站输入的症状、体质、病史、服药情况或其他健康资讯，可能属于敏感资料。OpenTCM 并非医疗机构，本网站不提供医疗诊断、中医诊断、个性化治疗方案、中药处方、急症处理或专业医疗建议。</p><p>请勿因本网站提供的内容而延迟求医、自行用药、停止用药或更改现有治疗方案。如有任何健康问题，请咨询合资格医生、中医师或其他医疗专业人士。如遇急症，请立即联络当地紧急救援服务或前往急症室。</p><h3>7. AI 内容限制</h3><p>AI 生成内容可能不完整、不准确、过时、未必适用于个别情况，亦可能与专业医疗意见不一致。你不应完全依赖 AI 回答作出医疗、用药、食疗或健康相关决定。</p><h3>8. 第三方技术服务</h3><p>OpenTCM 使用第三方 API 模型及相关技术服务提供 AI 问答功能。你输入的查询内容及相关必要资料，可能会被传送至第三方技术服务供应商处理。请避免输入可识别身份的个人资料或高度敏感资料。</p><h3>9. Cookie 及技术资料</h3><p>本网站可能使用 Cookie 或类似技术，以维持网站基本功能、分析使用情况、改善服务及侦测安全风险。</p><h3>10. 资料使用限制</h3><p>OpenTCM 目前作为研究及测试平台，不会将你的个人资料用于商业市场推广，亦不会出售你的个人资料予第三方作推广用途。</p><h3>11. 资料保存</h3><p>我们只会在研究、测试、系统改进、安全维护或法律要求所需的合理期间内保存资料。当资料不再需要时，我们会在合理可行范围内删除、匿名化或去识别化相关资料。</p><h3>12. 资料安全</h3><p>我们会采取合理的技术及管理措施，以保护资料免受未经授权或意外的存取、使用、披露、修改、遗失或删除。</p><h3>13. 使用者对资料的查询</h3><p>在适用法律允许的范围内，你可以向我们查询与你相关的资料处理安排，或要求更正、删除你曾提供的个人资料。</p><h3>14. 未成年人</h3><p>本网站并非专为未成年人而设。如你未满法定年龄，应在父母或监护人的同意及陪同下使用本网站。</p><h3>15. 适用法律及合规</h3><p>我们会在合理可行范围内，按适用的个人资料保护及相关法律要求处理个人资料，包括资料收集目的、资料准确性、保存期限、使用限制、资料安全、透明度及查阅更正安排。</p><p>本政策并不限制你在适用法律下享有的任何权利。</p><h3>16. 本政策的更新</h3><p>本政策可能会因平台测试、研究安排、网站功能或资料处理方式调整而更新。更新版本会刊登于本页，并标明最后更新日期。</p><h3>17. 查询</h3><p>如对本政策有任何疑问，请联系 OpenTCM 研究团队。</p>`,
  disclaimer:`<h2>免责声明</h2><div class="updated">最后更新日期：2026年5月13日</div><div class="notice">OpenTCM 目前只作研究、测试及专家评估用途，并非正式医疗服务或面向公众的医疗建议平台。</div><h3>1. 非医疗服务</h3><p>OpenTCM 并非医疗机构。本网站及 AI 生成内容不构成医疗诊断、中医诊断、治疗建议、中药处方、急症处理或专业医疗意见。</p><h3>2. AI 内容限制</h3><p>AI 生成内容可能不完整、不准确、过时或不适用于个别情况，亦可能未能充分考虑完整病史、体质、药物、过敏或其他健康因素。</p><h3>3. 不应依赖作医疗决定</h3><p>你不应完全依赖本网站内容作出医疗、用药、食疗、保健或治疗相关决定。请勿因本网站内容而延迟求医、自行用药、停止用药或更改治疗方案。</p><h3>4. 专业医疗意见</h3><p>如有任何健康问题，请咨询合资格医生、中医师或其他医疗专业人士。如遇急症，请立即联络当地紧急救援服务或前往急症室。</p><h3>5. 测试资料</h3><p>如你以专家身份参与测试，请避免输入可识别病人或第三者身份的资料。如需使用个案作测试，请先作匿名化或去识别化处理。</p>`,
  usage:`<h2>使用须知</h2><div class="updated">最后更新日期：2026年5月13日</div><h3>1. 使用对象</h3><p>OpenTCM 目前主要供受邀专家于研究、测试、评估及系统改进用途下使用，并非面向公众的正式医疗或健康服务。</p><h3>2. 使用方式</h3><ul><li>请以测试、研究及专家评估目的使用本网站。</li><li>请勿输入可识别你、病人或任何第三者身份的资料。</li><li>如涉及个案、病史或健康资料，请先作匿名化或去识别化处理。</li><li>请勿使用本网站作急症处理、诊断、处方或个性化治疗用途。</li></ul><h3>3. 禁止行为</h3><ul><li>不得滥用、攻击、干扰或尝试未经授权存取本网站或系统。</li><li>不得输入违法、侵权、恶意、误导或不当内容。</li><li>不得将 AI 回答包装为正式医疗诊断、处方或专业医疗意见。</li><li>不得未经授权收集、复制或大量撷取网站内容。</li></ul><h3>4. 内容及可用性</h3><p>本网站内容、功能及 AI 回答仍在测试及改进中，可能出现错误、中断、延迟或不稳定情况。</p><h3>5. 知识产权</h3><p>除非另有说明，本网站的设计、文字、系统结构及相关内容由 OpenTCM 或相关权利人拥有。未经授权，不得作商业复制、分发或改编。</p><h3>6. 接受本须知</h3><p>你使用本网站，即表示你理解并同意本使用须知、隐私政策及免责声明。如你不同意，请停止使用本网站。</p>`

 en:{
  privacy:`<h2>OpenTCM Privacy Policy</h2><div class="updated">Last updated: 13 May 2026</div><p>Welcome to OpenTCM. OpenTCM is currently a traditional Chinese medicine AI question-and-answer platform in the research and testing stage. At this stage, it is mainly intended for invited experts to participate in testing, evaluation and research.</p><p>This policy explains how we may collect, use, process, store and protect data when you use this website and related testing services.</p><div class="notice">This website is not currently a formal medical service platform and does not provide medical diagnosis, treatment, prescriptions, emergency handling or personalised medical advice to the public. The content is for general TCM knowledge, research, testing and system evaluation purposes only.</div><p>If you do not agree with this policy, please stop using this website.</p><h3>1. Nature of the Platform</h3><p>OpenTCM is currently in the research and testing stage. Website functions, content, AI responses, system stability and data handling practices are still being tested and improved.</p><p>The platform is mainly for invited experts and may be used to test TCM AI Q&A functions, evaluate response quality and safety, improve the user experience, conduct non-commercial research and technical improvements, and improve system stability.</p><p>The platform does not provide medical diagnosis, treatment, prescriptions, emergency handling or personalised medical services.</p><h3>2. Do Not Enter Sensitive Personal Data</h3><p>When using OpenTCM, please do not enter identity document numbers, full names, addresses, phone numbers, payment information, medical record numbers, information that can identify you, a patient or any third party, or any private information that you do not want the system to process or record.</p><p>If testing involves cases, symptoms, medical history, constitution, medication or health information, please anonymise or de-identify the content before submission.</p><h3>3. What Data We May Collect</h3><p>When you use this website, we may collect or process questions, TCM descriptions, symptoms, health conditions, test cases, expert feedback, system and technical data, AI Q&A data and records needed for system operation or troubleshooting.</p><h3>4. How We Use Data</h3><p>We may use data to provide TCM AI Q&A testing functions, test and improve system performance, evaluate AI response quality and safety, analyse expert feedback and testing results, conduct research analysis and technical improvements, troubleshoot issues, improve user experience, prevent abuse, generate anonymised or statistical research data, and comply with applicable legal or regulatory requirements.</p><p>Where data is used for research analysis, we will, as far as reasonably practicable, use anonymised, de-identified or aggregated data to reduce the risk of identifying individuals.</p><h3>5. Research and Expert Testing</h3><p>OpenTCM is currently mainly used for research and expert testing. Content and feedback submitted by you may be used to analyse and improve the system.</p><h3>6. Important Note on Health Data</h3><p>Symptoms, constitution, medical history, medication information or other health data entered into this website may be sensitive data. OpenTCM is not a medical institution and does not provide medical diagnosis, TCM diagnosis, personalised treatment plans, herbal prescriptions, emergency handling or professional medical advice.</p><p>Do not delay seeking medical care, self-medicate, stop medication or change existing treatment based on this website. For health concerns, consult a qualified doctor, Chinese medicine practitioner or other healthcare professional. In an emergency, contact local emergency services or go to an emergency department immediately.</p><h3>7. Limitations of AI Content</h3><p>AI-generated content may be incomplete, inaccurate, outdated, unsuitable for individual circumstances or inconsistent with professional medical advice. You should not rely solely on AI responses to make medical, medication, dietary therapy or health-related decisions.</p><h3>8. Third-Party Technology Services</h3><p>OpenTCM uses third-party API models and related technology services to provide AI Q&A functions. Your query content and related necessary data may be transmitted to third-party technology service providers for processing. Please avoid entering identifiable personal data or highly sensitive information.</p><h3>9. Cookies and Technical Data</h3><p>This website may use cookies or similar technologies to maintain basic website functions, analyse usage, improve services and detect security risks.</p><h3>10. Restrictions on Data Use</h3><p>As a research and testing platform, OpenTCM will not use your personal data for commercial marketing and will not sell your personal data to third parties for promotional purposes.</p><h3>11. Data Retention</h3><p>We retain data only for a reasonable period necessary for research, testing, system improvement, security maintenance or legal requirements. When data is no longer needed, we will delete, anonymise or de-identify it as far as reasonably practicable.</p><h3>12. Data Security</h3><p>We take reasonable technical and organisational measures to protect data against unauthorised or accidental access, use, disclosure, alteration, loss or deletion.</p><h3>13. Data Enquiries</h3><p>To the extent permitted by applicable law, you may enquire about data processing arrangements relating to you or request correction or deletion of personal data you have provided. We may request reasonable information to verify your identity.</p><h3>14. Minors</h3><p>This website is not intended specifically for minors. If you are under the legal age, you should use this website with the consent and supervision of a parent or guardian.</p><h3>15. Applicable Law and Compliance</h3><p>As far as reasonably practicable, we handle personal data in accordance with applicable personal data protection and related legal requirements, including collection purposes, accuracy, retention, use limitations, data security, transparency, access and correction arrangements.</p><p>This policy does not limit any rights you may have under applicable law.</p><h3>16. Updates to This Policy</h3><p>This policy may be updated due to platform testing, research arrangements, website functions or changes in data handling practices. The updated version will be posted on this page with the last updated date.</p><h3>17. Enquiries</h3><p>If you have any questions about this policy, please contact the OpenTCM research team.</p>`,
  disclaimer:`<h2>Disclaimer</h2><div class="updated">Last updated: 13 May 2026</div><div class="notice">OpenTCM is currently for research, testing and expert evaluation purposes only. It is not a formal medical service or a public-facing medical advice platform.</div><h3>1. Not a Medical Service</h3><p>OpenTCM is not a medical institution. This website and AI-generated content do not constitute medical diagnosis, TCM diagnosis, treatment advice, herbal prescriptions, emergency handling or professional medical advice.</p><h3>2. Limitations of AI Content</h3><p>AI-generated content may be incomplete, inaccurate, outdated or unsuitable for individual circumstances. It may not fully consider complete medical history, constitution, medication, allergies or other health factors.</p><h3>3. Do Not Rely on It for Medical Decisions</h3><p>You should not rely solely on this website to make medical, medication, dietary therapy, health or treatment-related decisions. Do not delay seeking medical care, self-medicate, stop medication or change treatment based on this website.</p><h3>4. Professional Medical Advice</h3><p>If you have health concerns, consult a qualified doctor, Chinese medicine practitioner or other healthcare professional. In an emergency, contact local emergency services or go to an emergency department immediately.</p><h3>5. Testing Data</h3><p>If you participate as an expert tester, please avoid entering data that can identify patients or third parties. If cases are used for testing, please anonymise or de-identify them first.</p>`,
  usage:`<h2>Usage Notice</h2><div class="updated">Last updated: 13 May 2026</div><h3>1. Intended Users</h3><p>OpenTCM is currently mainly intended for invited experts for research, testing, evaluation and system improvement. It is not a formal medical or health service for the public.</p><h3>2. How to Use</h3><ul><li>Use this website for testing, research and expert evaluation purposes.</li><li>Do not enter data that can identify you, a patient or any third party.</li><li>If cases, medical history or health data are involved, anonymise or de-identify them first.</li><li>Do not use this website for emergency handling, diagnosis, prescriptions or personalised treatment.</li></ul><h3>3. Prohibited Conduct</h3><ul><li>Do not abuse, attack, interfere with or attempt unauthorised access to the website or system.</li><li>Do not submit unlawful, infringing, malicious, misleading or inappropriate content.</li><li>Do not present AI responses as formal medical diagnoses, prescriptions or professional medical advice.</li><li>Do not collect, copy or scrape website content without authorisation.</li></ul><h3>4. Content and Availability</h3><p>The website content, functions and AI responses are still being tested and improved, and may contain errors, interruptions, delays or instability.</p><h3>5. Intellectual Property</h3><p>Unless otherwise stated, the design, text, system structure and related content of this website are owned by OpenTCM or relevant rights holders. Unauthorised commercial copying, distribution or adaptation is not permitted.</p><h3>6. Acceptance</h3><p>By using this website, you acknowledge and agree to this Usage Notice, the Privacy Policy and the Disclaimer. If you do not agree, please stop using this website.</p>`
 }
