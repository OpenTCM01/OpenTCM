<!DOCTYPE html>
<html lang="{{ 'en' if lang == 'en' else ('zh-Hant' if lang == 'zh-Hant' else 'zh-CN') }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenTCM</title>
    <meta name="description" content="OpenTCM GraphRAG 中医古籍智能问答助手">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/OpenTCM_favicon.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=20260702-welcome-cropped-logo">
</head>
<body data-page="welcome" data-initial-lang="{{ lang }}">
    <div class="site-top-bar">
        <img src="{{ url_for('static', filename='images/OpenTCM_site_logo.png') }}" alt="OpenTCM Logo" class="site-top-logo">
        <span class="site-top-name">OpenTCM</span>
        <div class="site-top-spacer"></div>
        <div class="language-switch" aria-label="Language">
            <button type="button" class="lang-btn" data-lang="zh-Hans">简</button>
            <button type="button" class="lang-btn" data-lang="zh-Hant">繁</button>
            <button type="button" class="lang-btn" data-lang="en">EN</button>
        </div>
        <a class="logout-link" data-i18n="logout" href="{{ url_for('logout', lang=lang) }}">退出</a>
    </div>

    <main class="welcome-page-container">
        <section class="homepage-content opentcm-panel">
            <div class="logo-container">
                <img src="{{ url_for('static', filename='images/opentcm_logo_cropped_20260702.png') }}" alt="OpenTCM" class="welcome-logo">
            </div>

            <div class="welcome-info">
                <h1 data-i18n="title">中医智能问答助手</h1>
                <p data-i18n="subtitle">
                    融合传统中医智慧与现代AI技术，为您提供专业、准确的中医知识咨询服务。
                </p>
            </div>

            <div class="features-preview opentcm-feature-row">
                <div class="feature-item">
                    <div class="feature-icon">🌿</div>
                    <div data-i18n="featureGraph">中药知识</div>
                </div>
                <div class="feature-item">
                    <div class="feature-icon">🏥</div>
                    <div data-i18n="featureSource">病症分析</div>
                </div>
                <div class="feature-item">
                    <div class="feature-icon">⚖️</div>
                    <div data-i18n="featureReason">养生保健</div>
                </div>
            </div>

            <button onclick="location.href='{{ url_for('chat_ui_page', lang=lang) }}'" class="chat-now-button" data-i18n="start">
                开始咨询 →
            </button>

            <nav class="guide-links" aria-label="Guides">
                <a id="legalLink" href="{{ url_for('guide', guide_type='legal', lang=lang) }}" target="_blank" rel="noopener" data-i18n="legal">免责声明</a>
                <a id="guideLink" href="{{ url_for('guide', guide_type='user', lang=lang) }}" target="_blank" rel="noopener" data-i18n="guide">操作指南</a>
            </nav>

            <div class="welcome-tip">
                <p data-i18n="tip">
                    温馨提示：本系统提供中医知识参考，不能替代专业医疗建议。如有健康问题，请及时咨询专业医生。
                </p>
            </div>
        </section>
    </main>

    <footer class="welcome-footer">
        <p>&copy; 2024-2026 OpenTCM. All rights reserved.</p>
    </footer>

    <script>
        const i18n = {
            "zh-Hans": {
                logout: "退出",
                title: "中医智能问答助手",
                subtitle: "融合传统中医智慧与现代AI技术，为您提供专业、准确的中医知识咨询服务。",
                featureGraph: "中药知识",
                featureSource: "病症分析",
                featureReason: "养生保健",
                start: "开始咨询 →",
                legal: "免责声明",
                guide: "操作指南",
                tip: "温馨提示：本系统提供中医知识参考，不能替代专业医疗建议。如有健康问题，请及时咨询专业医生。"
            },
            "zh-Hant": {
                logout: "登出",
                title: "中醫智能問答助手",
                subtitle: "融合傳統中醫智慧與現代AI技術，為您提供專業、準確的中醫知識諮詢服務。",
                featureGraph: "中藥知識",
                featureSource: "病症分析",
                featureReason: "養生保健",
                start: "開始諮詢 →",
                legal: "免責聲明",
                guide: "操作指南",
                tip: "溫馨提示：本系統提供中醫知識參考，不能替代專業醫療建議。如有健康問題，請及時諮詢專業醫生。"
            },
            en: {
                logout: "Log out",
                title: "Intelligent TCM Q&A Assistant",
                subtitle: "Integrating traditional TCM wisdom with modern AI technology to provide professional and accurate TCM knowledge consultation.",
                featureGraph: "Herbal knowledge",
                featureSource: "Symptom Analysis",
                featureReason: "Health preservation",
                start: "Start Chat →",
                legal: "Disclaimer",
                guide: "User Guide",
                tip: "Friendly reminder: this system provides TCM knowledge for reference and cannot replace professional medical advice. Please consult a qualified clinician for health concerns."
            }
        };

        function setLang(lang) {
            localStorage.setItem("opentcm_lang", lang);
            document.documentElement.lang = lang === "en" ? "en" : (lang === "zh-Hant" ? "zh-Hant" : "zh-CN");
            document.querySelectorAll("[data-i18n]").forEach(node => {
                const key = node.getAttribute("data-i18n");
                if (i18n[lang][key]) node.textContent = i18n[lang][key];
            });
            document.querySelectorAll(".lang-btn").forEach(btn => btn.classList.toggle("active", btn.dataset.lang === lang));
            document.querySelector(".chat-now-button").onclick = () => location.href = `/chat_page?lang=${encodeURIComponent(lang)}`;
            document.querySelector(".logout-link").href = `/logout?lang=${encodeURIComponent(lang)}`;
            document.getElementById("legalLink").href = `/guide/legal?lang=${encodeURIComponent(lang)}`;
            document.getElementById("guideLink").href = `/guide/user?lang=${encodeURIComponent(lang)}`;
        }

        document.querySelectorAll(".lang-btn").forEach(btn => btn.addEventListener("click", () => setLang(btn.dataset.lang)));
        setLang(localStorage.getItem("opentcm_lang") || document.body.dataset.initialLang || "zh-Hans");
    </script>
</body>
</html>
