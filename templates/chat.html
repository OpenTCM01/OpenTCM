        const chatStaticWelcome = document.getElementById("chatStaticWelcome");
        const sidebarToggle = document.getElementById("sidebarToggle");

        let currentConversationId = localStorage.getItem("opentcm_conversation_id") || "";
        let eventSource = null;

        function escapeHtml(text) {
            return String(text ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function renderInlineMarkdown(text) {
            let html = escapeHtml(text);
            html = html.replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>");
            html = html.replace(/\*(.*?)\*/g, "<em>$1</em>");
            html = html.replace(/[\[［]([sSmM])(\d+)[\]］]/g, (match, prefix, id) => {
                const sourceId = `${prefix.toUpperCase()}${id}`;
                return `<button type="button" class="citation-chip" data-source-id="${sourceId}">[${sourceId}]</button>`;
            });
            return html;
        }

        function simpleMarkdownToHtml(text) {
            const sectionNames = /^(核心结论|核心結論|古籍知识图谱证据|古籍知識圖譜證據|现代文献证据|現代文獻證據|英文研究证据|英文研究證據|中医辨证与方药分析|中醫辨證與方藥分析|现代检查\/药理与中西医对照|現代檢查\/藥理與中西醫對照|临床安全提醒|臨床安全提醒|严重风险提醒|嚴重風險提醒|可继续追问的问题|可繼續追問的問題|Core Conclusions?|Classical KG Evidence|Modern Literature Evidence|English Research Evidence|TCM Pattern and Formula Analysis|Modern Tests\/Pharmacology and TCM-Western Comparison|Clinical Safety Note|Serious-risk Reminder|Follow-up Questions?)[:：]?$/i;
            const lines = String(text ?? "").split(/\r?\n/);
            const rendered = [];
            let listOpen = false;

            const closeList = () => {
                if (listOpen) {
                    rendered.push("</ul>");
                    listOpen = false;
                }
            };

            lines.forEach(line => {
                const trimmed = line.trim();
                if (!trimmed) {
                    closeList();
                    rendered.push('<div class="answer-spacer"></div>');
                    return;
                }
                const markdownHeading = trimmed.match(/^#{1,4}\s+(.+)$/);
                if (markdownHeading || sectionNames.test(trimmed.replace(/\*\*/g, ""))) {
                    closeList();
                    const heading = markdownHeading ? markdownHeading[1] : trimmed.replace(/\*\*/g, "").replace(/[:：]$/, "");
                    rendered.push(`<div class="answer-section-heading">${renderInlineMarkdown(heading)}</div>`);
                    return;
                }
                const bullet = trimmed.match(/^[-*]\s+(.+)$/);
                const numbered = trimmed.match(/^(\d+)[.、]\s+(.+)$/);
                if (bullet || numbered) {
                    if (!listOpen) {
                        rendered.push('<ul class="answer-list">');
                        listOpen = true;
                    }
                    const content = bullet ? bullet[1] : numbered[2];
                    rendered.push(`<li>${renderInlineMarkdown(content)}</li>`);
                    return;
                }
                closeList();
                rendered.push(`<p class="answer-paragraph">${renderInlineMarkdown(line)}</p>`);
            });
            closeList();
            return rendered.join("");
        }

        function setLang(lang) {
            currentLang = lang;
            localStorage.setItem("opentcm_lang", lang);
            document.documentElement.lang = lang === "en" ? "en" : (lang === "zh-Hant" ? "zh-Hant" : "zh-CN");
            document.querySelectorAll("[data-i18n]").forEach(node => {
                const key = node.getAttribute("data-i18n");
                if (i18n[lang][key]) node.textContent = i18n[lang][key];
            });
            document.querySelectorAll(".lang-btn").forEach(btn => btn.classList.toggle("active", btn.dataset.lang === lang));
            modeButtons.forEach(btn => btn.classList.toggle("active", btn.dataset.mode === currentMode));
            document.querySelector(".logout-link").href = `/logout?lang=${encodeURIComponent(lang)}`;
            document.getElementById("backLink").href = `/?lang=${encodeURIComponent(lang)}`;
            userInput.placeholder = lang === "en" ? "Enter your TCM question..." : (lang === "zh-Hant" ? "請輸入您的中醫相關問題..." : "请输入您的中医相关问题...");
            document.querySelectorAll(".quick-question-btn").forEach(btn => {
                if (btn.classList.contains("template-btn")) {
                    btn.textContent = lang === "en" ? btn.dataset.labelEn : (lang === "zh-Hant" ? btn.dataset.labelHant : btn.dataset.labelZh);
                } else {
                    btn.textContent = lang === "en" ? btn.dataset.qEn : (lang === "zh-Hant" ? btn.dataset.qHant : btn.dataset.qZh);
                }
            });
            renderConversationList(window.__opentcmConversations || []);
        }

        async function fetchJson(url, options = {}) {
            const response = await fetch(url, {
                credentials: "same-origin",
                headers: { "Content-Type": "application/json" },
                ...options
            });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            return response.json();
        }

        function setCurrentConversation(id) {
            currentConversationId = id || "";
            if (currentConversationId) {
                localStorage.setItem("opentcm_conversation_id", currentConversationId);
            } else {
                localStorage.removeItem("opentcm_conversation_id");
            }
        }

        function renderConversationList(conversations) {
            window.__opentcmConversations = conversations || [];
            conversationList.innerHTML = "";
            if (!conversations || !conversations.length) {
                const empty = document.createElement("div");
                empty.className = "conversation-empty";
                empty.textContent = i18n[currentLang].noConversations;
                conversationList.appendChild(empty);
                return;
            }
            conversations.forEach(item => {
                const row = document.createElement("button");
                row.type = "button";
                row.className = `conversation-item${item.id === currentConversationId ? " active" : ""}`;
                row.innerHTML = `
                    <span class="conversation-title">${escapeHtml(item.title || i18n[currentLang].newChat)}</span>
                    <span class="conversation-meta">${escapeHtml((item.updated_at || "").replace("T", " ").slice(0, 16))}</span>
                    <span class="conversation-delete" role="button" title="${escapeHtml(i18n[currentLang].deleteConversation)}" data-delete-id="${escapeHtml(item.id)}">×</span>
                `;
                row.addEventListener("click", event => {
                    const deleteTarget = event.target.closest("[data-delete-id]");
                    if (deleteTarget) {
                        event.stopPropagation();
                        deleteConversation(deleteTarget.dataset.deleteId);
                        return;
                    }
                    loadConversation(item.id);
                });
                conversationList.appendChild(row);
            });
        }

        async function loadConversations() {
            try {
                const data = await fetchJson("/api/conversations");
                renderConversationList(data.conversations || []);
            } catch (error) {
                console.error("Failed to load conversations", error);
            }
        }

        function clearChat() {
            chatMessagesContainer.innerHTML = "";
            sourceMap = {};
            if (chatStaticWelcome) chatStaticWelcome.style.display = "";
        }

        function renderHistoricalMessage(message) {
            if (message.role === "user") {
                appendUserMessage(message.content || "");
                return;
            }
            const wrapper = createAssistantMessageWrapper();
            const final = createFinalAnswerContainer(wrapper, i18n[currentLang].finalTitle);
            final.classList.add("streaming-complete");
            final.innerHTML = simpleMarkdownToHtml(message.content || "");
            if (message.sources && message.sources.length) {
                const existing = Object.values(sourceMap).filter(item => item && item.id);
                updateSources(existing.concat(message.sources));
            }
            const followups = message.metadata && message.metadata.followups;
            if (Array.isArray(followups) && followups.length) {
                renderFollowups(wrapper, followups);
            }
        }

        async function loadConversation(id) {
            try {
                const data = await fetchJson(`/api/conversations/${encodeURIComponent(id)}`);
                setCurrentConversation(id);
                clearChat();
                (data.messages || []).forEach(renderHistoricalMessage);
                if ((data.messages || []).length && chatStaticWelcome) chatStaticWelcome.style.display = "none";
                renderConversationList(window.__opentcmConversations || []);
                closeSidebar();
                scrollToBottom();
            } catch (error) {
                console.error("Failed to load conversation", error);
                setCurrentConversation("");
            }
        }

        async function createConversation() {
            try {
                const data = await fetchJson(`/api/conversations?lang=${encodeURIComponent(currentLang)}`, {
                    method: "POST",
                    body: JSON.stringify({})
                });
                setCurrentConversation(data.conversation.id);
                clearChat();
                await loadConversations();
                closeSidebar();
                userInput.focus();
            } catch (error) {
                console.error("Failed to create conversation", error);
            }
        }

        async function deleteConversation(id) {
            try {
                await fetchJson(`/api/conversations/${encodeURIComponent(id)}`, { method: "DELETE" });
                if (id === currentConversationId) {
                    setCurrentConversation("");
                    clearChat();
                }
                await loadConversations();
            } catch (error) {
                console.error("Failed to delete conversation", error);
            }
        }

        function openSidebar() {
            conversationSidebar.classList.add("open");
            sidebarBackdrop.hidden = false;
        }

        function closeSidebar() {
            conversationSidebar.classList.remove("open");
            sidebarBackdrop.hidden = true;
        }

        function appendUserMessage(text) {
            const messageDiv = document.createElement("div");
            messageDiv.className = "message user-message";
            const content = document.createElement("div");
            content.className = "message-content";
            content.textContent = text;
            messageDiv.appendChild(content);
            chatMessagesContainer.appendChild(messageDiv);
            scrollToBottom();
        }

        function scrollToBottom() {
            setTimeout(() => chatMessagesContainer.scrollTo({ top: chatMessagesContainer.scrollHeight, behavior: "smooth" }), 60);
        }

        function updateSendButton(isSending) {
            userInput.disabled = isSending;
            sendButton.disabled = isSending;
            modeButtons.forEach(btn => btn.disabled = isSending);
            if (isSending) {
                sendButtonText.textContent = currentMode === "deep" ? i18n[currentLang].deepMode : i18n[currentLang].fastMode;
                sendButtonIcon.innerHTML = `<div class="typing-dots compact"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>`;
            } else {
                sendButtonText.textContent = i18n[currentLang].send;
                sendButtonIcon.textContent = "→";
            }
        }

        function createAssistantMessageWrapper() {
            const messageDiv = document.createElement("div");
            messageDiv.className = "message assistant-message";
            const avatar = document.createElement("div");
            avatar.className = "assistant-avatar";
            avatar.textContent = currentLang === "en" ? "AI" : "中";
            const content = document.createElement("div");
            content.className = "assistant-content-wrapper";
            messageDiv.appendChild(avatar);
            messageDiv.appendChild(content);
            chatMessagesContainer.appendChild(messageDiv);
            return content;
        }

        function createThinkingContainer(wrapper, title) {
            const box = document.createElement("div");
            box.className = "thinking-container";
            box.innerHTML = `
                <div class="thinking-header">
                    <div class="thinking-title"><span class="thinking-icon">KG</span><span>${escapeHtml(title || i18n[currentLang].thinking)}</span></div>
                    <button type="button" class="thinking-toggle" aria-label="Toggle">▲</button>
                </div>
                <div class="thinking-content"></div>
            `;
            box.querySelector(".thinking-toggle").addEventListener("click", () => toggleThinking(box));
            wrapper.appendChild(box);
            return box.querySelector(".thinking-content");
        }

        function createStandardStatus(wrapper, content) {
            const box = document.createElement("div");
            box.className = "standard-status";
            box.innerHTML = `
                <span class="standard-status-spinner" aria-hidden="true"></span>
                <span>${escapeHtml(content || i18n[currentLang].standardPending)}</span>
            `;
            wrapper.appendChild(box);
            return box;
        }

        function createFinalAnswerContainer(wrapper, title) {
            const box = document.createElement("div");
            box.className = "final-answer-container";
            box.innerHTML = `
                <div class="final-answer-header"><span class="final-answer-icon">AI</span><span>${escapeHtml(title || i18n[currentLang].finalTitle)}</span></div>
                <div class="final-answer-content"></div>
            `;
            wrapper.appendChild(box);
            return box.querySelector(".final-answer-content");
        }

        function renderFollowups(wrapper, questions) {
            if (!questions || !questions.length) return;
            const box = document.createElement("div");
            box.className = "followup-suggestions";
            box.innerHTML = questions.slice(0, 5).map(question =>
                `<button type="button" class="followup-btn">${escapeHtml(question)}</button>`
            ).join("");
            wrapper.appendChild(box);
        }

        function toggleThinking(box) {
            const content = box.querySelector(".thinking-content");
            const button = box.querySelector(".thinking-toggle");
            const closed = content.style.display === "none";
            content.style.display = closed ? "block" : "none";
            button.textContent = closed ? "▲" : "▼";
            box.classList.toggle("collapsed", !closed);
        }

        function updateSources(sources) {
            sourceMap = {};
            (sources || []).forEach(source => {
                sourceMap[source.id] = source;
                sourceMap[String(source.id || "").toLowerCase()] = source;
                sourceMap[String(source.id || "").toUpperCase()] = source;
            });
        }

        function showSourcePopover(sourceId, anchor) {
            const source = sourceMap[sourceId] || sourceMap[String(sourceId || "").toUpperCase()] || sourceMap[String(sourceId || "").toLowerCase()];
            if (!source) return;
            const entityText = (source.entities || []).slice(0, 10).map(e => `${escapeHtml(e.text)}(${escapeHtml(e.type || "")})`).join("、");
            const tripleText = (source.triplets || []).slice(0, 8).map(t =>
                `<li>${escapeHtml(t.head_text)} --${escapeHtml(t.relation)}--> ${escapeHtml(t.tail_text)}</li>`
            ).join("");
            const isModern = source.source_type === "modern";
            const evaluationText = (source.evaluation_data || []).slice(0, 5).map(item =>
                `<li>${escapeHtml(item.evidence || item.value || "")}</li>`
            ).join("");
            const modernMeta = isModern ? `
                <div class="source-book">${escapeHtml(i18n[currentLang].modernSource)}：${escapeHtml(source.title || source.book_title || "")}</div>
                <div class="source-path">${escapeHtml(source.relative_path || "")}</div>
                ${(source.authors || []).length ? `<div class="source-section"><strong>${escapeHtml(i18n[currentLang].authors)}:</strong> ${escapeHtml((source.authors || []).join("、"))}</div>` : ""}
                ${source.journal || source.publication_year ? `<div class="source-section"><strong>${escapeHtml(i18n[currentLang].journal)}:</strong> ${escapeHtml(source.journal || "")} ${source.publication_year ? `｜${escapeHtml(i18n[currentLang].year)}: ${escapeHtml(source.publication_year)}` : ""}</div>` : ""}
                ${source.source_condition || source.treatment_category ? `<div class="source-section"><strong>${escapeHtml(i18n[currentLang].condition)}:</strong> ${escapeHtml(source.source_condition || "")} ${source.treatment_category ? `｜${escapeHtml(i18n[currentLang].category)}: ${escapeHtml(source.treatment_category)}` : ""}</div>` : ""}
                ${(source.keywords || []).length ? `<div class="source-section"><strong>${escapeHtml(i18n[currentLang].keywords)}:</strong> ${escapeHtml((source.keywords || []).join("、"))}</div>` : ""}
                ${source.abstract ? `<div class="source-section"><strong>${escapeHtml(i18n[currentLang].abstract)}:</strong><p>${escapeHtml(source.abstract)}</p></div>` : ""}
                ${source.abstract_omitted ? `<div class="source-section"><strong>${escapeHtml(i18n[currentLang].abstract)}:</strong><p>${escapeHtml(i18n[currentLang].ocrOmitted)}</p></div>` : ""}
                ${source.conclusion ? `<div class="source-section"><strong>${escapeHtml(i18n[currentLang].conclusion)}:</strong><p>${escapeHtml(source.conclusion)}</p></div>` : ""}
                ${source.conclusion_omitted ? `<div class="source-section"><strong>${escapeHtml(i18n[currentLang].conclusion)}:</strong><p>${escapeHtml(i18n[currentLang].ocrOmitted)}</p></div>` : ""}
                ${evaluationText ? `<div class="source-section"><strong>${escapeHtml(i18n[currentLang].evaluation)}:</strong><ul>${evaluationText}</ul></div>` : ""}
            ` : "";
            const classicalMeta = !isModern ? `
                <div class="source-book">《${escapeHtml(source.book_title)}》</div>
                <div class="source-path">${escapeHtml(source.relative_path)}</div>
                <div class="source-section"><strong>${escapeHtml(i18n[currentLang].original)}:</strong><p>${escapeHtml(source.text)}</p></div>
            ` : "";
            sourcePopover.innerHTML = `
                <div class="source-popover-header">
                    <strong>${escapeHtml(i18n[currentLang].sourceTitle)} ${escapeHtml(source.id)}</strong>
                    <button type="button" class="source-close" aria-label="Close">×</button>
                </div>
                ${modernMeta}
                ${classicalMeta}
                ${entityText ? `<div class="source-section"><strong>${escapeHtml(i18n[currentLang].entities)}:</strong> ${entityText}</div>` : ""}
                ${tripleText ? `<div class="source-section"><strong>${escapeHtml(i18n[currentLang].triples)}:</strong><ul>${tripleText}</ul></div>` : ""}
            `;
            sourcePopover.hidden = false;
            const rect = anchor.getBoundingClientRect();
            const top = Math.min(window.innerHeight - 24, rect.bottom + 8);
            const popoverWidth = Math.min(sourcePopover.offsetWidth || 380, window.innerWidth - 24);
            const left = Math.max(12, Math.min(window.innerWidth - popoverWidth - 12, rect.left));
            sourcePopover.style.top = `${top + window.scrollY}px`;
            sourcePopover.style.left = `${left + window.scrollX}px`;
            sourcePopover.querySelector(".source-close").addEventListener("click", () => sourcePopover.hidden = true);
        }

        function handleStreaming(query) {
            if (chatStaticWelcome) chatStaticWelcome.style.display = "none";
            appendUserMessage(query);
            updateSendButton(true);
            sourcePopover.hidden = true;

            let thinkingContainer = null;
            let standardStatus = null;
            let currentThinkingStep = null;
            let currentThinkingStepRaw = "";
            let finalAnswerContainer = null;
            let finalAnswerRaw = "";
            const wrapper = createAssistantMessageWrapper();

            const conversationParam = currentConversationId ? `&conversation_id=${encodeURIComponent(currentConversationId)}` : "";
            eventSource = new EventSource(`/api/chat?query=${encodeURIComponent(query)}&lang=${encodeURIComponent(currentLang)}&mode=${encodeURIComponent(currentMode)}${conversationParam}`);
            eventSource.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    switch (data.type) {
                        case "conversation":
                            setCurrentConversation(data.conversation_id);
                            loadConversations();
                            break;
                        case "thinking_start":
                            thinkingContainer = createThinkingContainer(wrapper, data.title);
                            break;
                        case "standard_status":
                            if (!standardStatus) {
                                standardStatus = createStandardStatus(wrapper, data.content);
                            }
                            break;
                        case "thinking_step": {
                            const step = document.createElement("div");
                            step.className = "thinking-step";
                            step.innerHTML = `
                                <div class="thinking-step-title">
                                    <span class="step-number">${data.step}</span>
                                    <span class="step-title-text">${escapeHtml(data.title)}</span>
                                </div>
                                <div class="thinking-step-content"></div>
                            `;
                            thinkingContainer.appendChild(step);
                            currentThinkingStep = step.querySelector(".thinking-step-content");
                            currentThinkingStepRaw = "";
                            break;
                        }
                        case "thinking_content":
                            if (currentThinkingStep) {
                                currentThinkingStepRaw += data.content;
                                currentThinkingStep.innerHTML = simpleMarkdownToHtml(currentThinkingStepRaw);
                            }
                            break;
                        case "sources":
                            updateSources(data.sources);
                            break;
                        case "thinking_end":
                            if (thinkingContainer) thinkingContainer.closest(".thinking-container").classList.add("thinking-complete");
                            break;
                        case "final_answer_start":
                            if (standardStatus) {
                                standardStatus.remove();
                                standardStatus = null;
                            }
                            finalAnswerContainer = createFinalAnswerContainer(wrapper, data.title);
                            break;
                        case "final_answer_content":
                            if (finalAnswerContainer) {
                                finalAnswerContainer.classList.add("streaming-final-answer");
                                finalAnswerRaw += data.content;
                                finalAnswerContainer.innerHTML = simpleMarkdownToHtml(finalAnswerRaw);
                            }
                            break;
                        case "followups":
                            renderFollowups(wrapper, data.questions || []);
                            break;
                        case "final_end":
                            if (finalAnswerContainer) {
                                finalAnswerContainer.classList.remove("streaming-final-answer");
                                finalAnswerContainer.classList.add("streaming-complete");
                            }
                            updateSendButton(false);
                            eventSource.close();
                            loadConversations();
                            userInput.focus();
                            break;
                        case "error": {
                            const error = document.createElement("div");
                            error.className = "message-content error-message";
                            error.textContent = i18n[currentLang].errorPrefix + data.content;
                            wrapper.appendChild(error);
                            updateSendButton(false);
                            eventSource.close();
                            break;
                        }
                    }
                    scrollToBottom();
                } catch (error) {
                    console.error("Failed to parse SSE data", error);
                }
            };
            eventSource.onerror = function() {
                const error = document.createElement("div");
                error.className = "message-content error-message";
                error.textContent = i18n[currentLang].networkError;
                wrapper.appendChild(error);
                updateSendButton(false);
                if (eventSource) eventSource.close();
            };
        }

        function sendMessage() {
            const query = userInput.value.trim();
            if (!query || sendButton.disabled) return;
            quickQuestions.style.display = "none";
            userInput.value = "";
            userInput.style.height = "auto";
            if (eventSource) eventSource.close();
            handleStreaming(query);
        }

        document.querySelectorAll(".lang-btn").forEach(btn => btn.addEventListener("click", () => setLang(btn.dataset.lang)));
        sidebarToggle.addEventListener("click", openSidebar);
        sidebarBackdrop.addEventListener("click", closeSidebar);
        newConversationBtn.addEventListener("click", createConversation);
        modeButtons.forEach(btn => btn.addEventListener("click", () => {
            currentMode = btn.dataset.mode;
            localStorage.setItem("opentcm_answer_mode", currentMode);
            modeButtons.forEach(item => item.classList.toggle("active", item.dataset.mode === currentMode));
        }));
        sendButton.addEventListener("click", sendMessage);
        userInput.addEventListener("input", function() {
            this.style.height = "auto";
            this.style.height = `${this.scrollHeight}px`;
        });
        userInput.addEventListener("keypress", event => {
            if (event.key === "Enter" && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        });
        quickQuestionsToggle.addEventListener("click", () => {
            quickQuestions.style.display = quickQuestions.style.display === "block" ? "none" : "block";
        });
        document.addEventListener("click", event => {
            const citation = event.target.closest(".citation-chip");
            if (citation) {
                showSourcePopover(citation.dataset.sourceId, citation);
                return;
            }
            if (event.target.classList.contains("quick-question-btn")) {
                userInput.value = currentLang === "en" ? event.target.dataset.qEn : (currentLang === "zh-Hant" ? event.target.dataset.qHant : event.target.dataset.qZh);
                quickQuestions.style.display = "none";
                if (!event.target.classList.contains("template-btn")) sendMessage();
                return;
            }
            if (event.target.classList.contains("followup-btn")) {
                userInput.value = event.target.textContent;
                sendMessage();
                return;
            }
            if (!sourcePopover.contains(event.target) && !citation) sourcePopover.hidden = true;
            if (!quickQuestions.contains(event.target) && event.target !== quickQuestionsToggle) quickQuestions.style.display = "none";
        });

        setLang(currentLang);
        loadConversations().then(() => {
            if (currentConversationId) loadConversation(currentConversationId);
        });
        userInput.focus();
    </script>
</body>
</html>
